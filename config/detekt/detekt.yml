# On top of detekt's defaults (buildUponDefaultConfig). Each module's detekt-baseline.xml holds the
# findings from before detekt was added (2026-11-06); new code must pass.

naming:
  FunctionNaming:
    # Composables are named like types.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

complexity:
  LongParameterList:
    # Composables take many parameters by design.
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Preview']

style:
  MaxLineLength:
    # Matches .editorconfig.
    maxLineLength: 140
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']

coroutines:
  # Catching Throwable around a suspend call swallows cancellation; use runSuspendCatching.
  SuspendFunSwallowedCancellation:
    active: true

Compose:
  ComposableAnnotationNaming:
    active: true
  ModifierMissing:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  ParameterNaming:
    # This code names callbacks onSelected / onChanged, not onSelect / onChange.
    active: false
  CompositionLocalAllowlist:
    # The theme and kit define their own locals.
    active: false
  RememberMissing:
    active: true
  ViewModelForwarding:
    active: true
