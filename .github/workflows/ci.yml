name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    # Gradle has no per-test timeout; a hung test fails the job here instead of running for hours.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Temurin 21 is preinstalled on the runner. Gradle then provisions the JetBrains 21 daemon JVM
      # it is pinned to (gradle/gradle-daemon-jvm.properties) from those toolchain URLs. setup-java's
      # own "jetbrains" distribution resolves versions through the GitHub API unauthenticated and
      # fails on the shared runner IP's rate limit.
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/testDebugUnitTest/"
          if-no-files-found: ignore
