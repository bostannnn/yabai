name: Build release APK

on:
  workflow_dispatch:
  push:
    # Version tags, with or without a leading "v": 0.6.0, v0.6.0.
    tags:
      - "v[0-9]*"
      - "[0-9]*"

permissions:
  contents: read

jobs:
  release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Tag builds publish a GitHub Release.
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The whole history and its tags, for the release notes since the previous tag.
          fetch-depth: 0

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $app_version in app/build.gradle.kts"
            exit 1
          fi

      # Temurin 21 is preinstalled on the runner. Gradle then provisions the JetBrains 21 daemon JVM
      # it is pinned to (gradle/gradle-daemon-jvm.properties) from those toolchain URLs. setup-java's
      # own "jetbrains" distribution resolves versions through the GitHub API unauthenticated and
      # fails on the shared runner IP's rate limit.
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          test -n "$ANDROID_SIGNING_STORE_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_ALIAS"
          test -n "$ANDROID_SIGNING_KEY_PASSWORD"

      - name: Decode release keystore
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.keystore"

      - name: Run tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/signing/release.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: unified-reader-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # The app's updater shows the notes' bullet lines as "What's new"; edit the release on
        # GitHub afterwards to reword them.
        run: |
          apk="$RUNNER_TEMP/yabai-$GITHUB_REF_NAME.apk"
          notes="$RUNNER_TEMP/release-notes.md"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          .github/scripts/release-notes.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > "$notes"
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "yabai $GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --verify-tag
