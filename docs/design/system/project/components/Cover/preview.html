<!-- @dsCard height=288 -->
<div class="yb-cover-root">
  <style>
    .yb-cover-root { position: relative; width: 960px; height: 288px; background: var(--background); overflow: hidden; font-family: var(--font-sans); }
    .yb-cover-root svg { position: absolute; inset: 0; }
    .yb-cover-root .card { fill: var(--primary-container); rx: var(--radius-container); }
    .yb-cover-root .c1 { fill: var(--primary); rx: var(--radius-cover); }
    .yb-cover-root .c2 { fill: var(--tertiary); rx: var(--radius-cover); }
    .yb-cover-root .c3 { fill: var(--on-background); rx: var(--radius-cover); }
    .yb-cover-root .c4 { fill: var(--surface-container-highest); rx: var(--radius-cover); }
    .yb-cover-root .bar { fill: var(--on-primary-container); rx: var(--radius-pill); }
    .yb-cover-root .text { position: absolute; left: 40px; bottom: 32px; width: 440px; }
    .yb-cover-root h1 { margin: 0; font-size: 120px; line-height: 0.92; font-weight: 800; letter-spacing: -0.04em; color: var(--on-background); }
    .yb-cover-root p { margin: 14px 0 0; font-size: 14px; line-height: 20px; color: var(--on-surface-variant); }
  </style>
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <!--
      blocks: card (primary-container, radius-container) 400x232 bleeding off the right; covers 2:3 at 96x144 in primary, tertiary, on-background, surface-container-highest (radius-cover)
      arrangement: the reading card with a shelf strip of covers crossing it, the way the library home composes
      pattern: a literal motif, the cover tile (2:3, radius-cover) at grid-gap 16, because the books are the colour
      steps and radii: grid-gap 16, inset 20, section-gap 24; radius-cover 6, radius-container 20, radius-pill for the progress bar
    -->
    <rect class="card" x="520" y="-20" width="460" height="252" rx="20"/>
    <rect class="c3" x="544" y="44" width="96" height="144" rx="6"/>
    <rect class="bar" x="664" y="164" width="248" height="4" rx="2"/>
    <rect class="c2" x="544" y="216" width="96" height="144" rx="6"/>
    <rect class="c1" x="656" y="216" width="96" height="144" rx="6"/>
    <rect class="c4" x="768" y="216" width="96" height="144" rx="6"/>
    <rect class="c3" x="880" y="216" width="96" height="144" rx="6"/>
  </svg>
  <div class="text">
    <h1>yabai</h1>
    <p>Glass chrome over flat content, colour from the covers.</p>
  </div>
</div>
<script>/* static cover */</script>
